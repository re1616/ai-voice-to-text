name: Smoke test (emulator)

# Runs the release APK on an x86_64 emulator (arm64 code runs through the emulator's
# ARM translation) and clicks through the main screens. Screenshots and logcat are
# pushed to the `ci-smoke` branch.
on:
  push:
    branches: [ smoke ]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        shell: bash
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ./scripts/fetch-deps.sh
          python3 scripts/gen_catalog.py
          ./gradlew --no-daemon assembleStandardRelease
          cp app/build/outputs/apk/standard/release/*.apk app.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/smoke.sh

      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p smoke-out
          cd smoke-out
          git init -q -b ci-smoke
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "smoke ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-smoke:ci-smoke

  native:
    # Exercises the JNI bridges on the x86_64 runner with real models and a sample recording.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build host JNI libraries and run
        shell: bash
        run: |
          mkdir -p native-out
          set -o pipefail
          {
            ./scripts/fetch-deps.sh
            J=$JAVA_HOME/include
            for m in whisper llama; do
              cmake -S $m/src/main/cpp -B /tmp/b-$m -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-I$J -I$J/linux" -DCMAKE_C_FLAGS="-I$J -I$J/linux" > /dev/null
              cmake --build /tmp/b-$m --target ${m}_jni -j 4 > /dev/null
            done
            HF=https://huggingface.co
            curl -sL -o /tmp/base.bin $HF/ggerganov/whisper.cpp/resolve/main/ggml-base-q8_0.bin
            curl -sL -o /tmp/vad.bin $HF/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
            curl -sL -o /tmp/llm.gguf $HF/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf
            ls -la /tmp/*.bin /tmp/*.gguf
            mkdir -p /tmp/nt
            javac -d /tmp/nt $(find scripts/native-test -name "*.java")
            java -cp /tmp/nt NativeTest /tmp/b-whisper/libwhisper_jni.so /tmp/b-llama/libllama_jni.so /tmp/base.bin /tmp/vad.bin third_party/whisper.cpp/samples/jfk.wav /tmp/llm.gguf
          } 2>&1 | tee native-out/native.txt
      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p native-out && cd native-out
          git init -q -b ci-native
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "native ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-native:ci-native
